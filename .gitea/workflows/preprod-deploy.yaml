# Nom du workflow visible dans Gitea
name: preprod-deploy

# Declencheurs
on:
  push:
    branches:
      - preprod
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dependances
        run: npm ci

      - name: Verifier le lint
        run: npm run lint

      - name: Executer les tests unitaires services/hooks
        run: npx vitest run src/services/__tests__ src/hooks/__tests__

  deploy-preprod:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contexte run
        run: |
          echo "ref=${{ gitea.ref }}"
          echo "sha=${{ gitea.sha }}"

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PREPROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy preprod (build Next + restart systemd)
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" "
            set -euo pipefail
            cd '${{ secrets.PREPROD_APP_PATH }}'
            git fetch --all --prune
            git checkout preprod
            git pull --ff-only origin preprod
            npm ci
            npm run build
            # Copier les assets publics dans le standalone (requis par Next)
            cp -r public .next/standalone/public 2>/dev/null || true
            cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
            sudo systemctl restart openairmap
            echo 'SHA deploye:' \$(git rev-parse --short HEAD)
            systemctl is-active openairmap
          "
